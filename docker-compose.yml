services:
  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    volumes:
      - peluso_data:/data
    restart: unless-stopped

  web:
    build: .
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - peluso_data:/data
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  peluso_data:
