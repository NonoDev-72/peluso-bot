<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Peluso Bot{% endblock %}</title>
  <link rel="stylesheet" href="{{ base_path }}/static/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ base_path }}/">🤖 Peluso Bot</a>
    {% if user %}
      <span class="user">{{ user.username }}</span>
      <a class="btn btn-ghost" href="{{ base_path }}/auth/logout">Cerrar sesión</a>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <a href="{{ base_path }}/legal/terms">Condiciones de servicio</a>
    <span class="footer-sep">·</span>
    <a href="{{ base_path }}/legal/privacy">Política de privacidad</a>
  </footer>
  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var message = params.get("toast");
    if (!message) return;

    params.delete("toast");
    var query = params.toString();
    var cleanUrl = window.location.pathname + (query ? "?" + query : "") + window.location.hash;
    window.history.replaceState({}, "", cleanUrl);

    var container = document.createElement("div");
    container.className = "toast-container";
    var toast = document.createElement("div");
    toast.className = "toast";
    var icon = document.createElement("span");
    icon.className = "toast-icon";
    icon.textContent = "✓";
    var text = document.createElement("span");
    text.textContent = message;
    toast.appendChild(icon);
    toast.appendChild(text);
    container.appendChild(toast);
    document.body.appendChild(container);
    setTimeout(function () { container.remove(); }, 3600);
  })();
  </script>
</body>
</html>
