<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Peluso Bot{% endblock %}</title>
  <link rel="stylesheet" href="{{ base_path }}/static/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ base_path }}/">Peluso Bot</a>
    {% if user %}
      <span class="user">{{ user.username }}</span>
      <a class="btn btn-ghost" href="{{ base_path }}/auth/logout">Cerrar sesión</a>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <a href="{{ base_path }}/legal/terms">Condiciones de servicio</a>
    <span class="footer-sep">·</span>
    <a href="{{ base_path }}/legal/privacy">Política de privacidad</a>
  </footer>
</body>
</html>
